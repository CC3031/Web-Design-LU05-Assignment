<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="/assets/styling/contact.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <header class="flex justify-between items-center p-6 shadow-md">
        <a class="text-3xl font-bold hover:underline" href="/">SupplemeX</a>
        <div id="supx-subheader" class="space-x-6">
            <a href="/contact.html" class="hover:underline">Contact Us</a>
            <a href="/product.html" class="hover:underline">Supplements</a>
        </div>
    </header>
    <div class="w-full flex justify-center">
    <img src="/assets/images/eminem.png" alt="Eminem image that satisfies learning unit 8's requirements" class="mt-10 w-[clamp(100px,20vw,600px)] h-full object-cover border shadow-lg border-gray-300 rounded-lg">
    </div>
    <main class="max-w-3xl mx-auto my-5 p-6 border rounded-md shadow-md">
        <div id="supx-contact-body">
            <h2 class="text-2xl font-bold mb-6 text-center">
                Do you have a question or concern?<br>
                Submit your response by filling out this form!
            </h2>
            <form id="supx-contact-form" class="space-y-6">
                <div class="form-question-answer flex flex-col">
                    <label for="concern" class="mb-2 font-bold">
                        Describe your concern, problem, or question in detail.
                    </label>
                    <input type="text" id="concern" name="concern"
                        placeholder="Response here..." required
                        class="border border-gray-300 rounded-md p-3"
                    >
                </div>
                <div class="form-question-answer flex flex-col">
                    <label for="additional-info" class="mb-2 font-bold">
                        Additional information (IE: device, steps to recreate, etc).
                    </label>
                    <input type="text" id="additional-info" name="additional-info"
                        placeholder="Response here..." required
                        class="border border-gray-300 rounded-md p-3"
                    >
                </div>
                <div class="form-question-answer flex flex-col">
                    <label for="contact-info" class="mb-2 font-bold">
                        Please enter your preferred contact information.
                    </label>
                    <input type="text" id="contact-info" name="contact-info"
                        placeholder="Response here..." required
                        class="border border-gray-300 rounded-md p-3"
                    >
                </div>
                <input id="submit-button" type="submit" value="Submit"
                    class="border border-black rounded-md w-full font-bold py-3 hover:bg-black hover:text-white cursor-pointer"
                >
            </form>
        </div>
    </main>

    <footer class="p-4 text-center">
        <p>Copyright SupplemeX Co. 2020-2026. All rights reserved.</p>
    </footer>
</body>
</html>
